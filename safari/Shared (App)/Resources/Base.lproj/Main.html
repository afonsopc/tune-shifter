<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <main>
        <header>
            <img class="icon" src="../Icon.png" width="96" height="96" alt="">
            <h1>Tune Shifter</h1>
            <p class="lead" data-pt="Velocidade, tom, volume e reverb para qualquer áudio ou vídeo no Safari."
               data-en="Speed, pitch, volume and reverb for any audio or video in Safari."></p>
        </header>

        <p class="status platform-mac state-on" data-pt="A extensão está ligada. Já podes usá-la no Safari."
           data-en="The extension is on. You can use it in Safari now."></p>
        <p class="status platform-mac state-off" data-pt="A extensão ainda está desligada."
           data-en="The extension is still off."></p>

        <section class="card">
            <h2 data-pt="Como ligar a extensão" data-en="How to turn on the extension"></h2>
            <ol class="platform-mac">
                <li data-pt="No Safari, abre <b>Safari &gt; Definições &gt; Extensões</b>."
                    data-en="In Safari, open <b>Safari &gt; Settings &gt; Extensions</b>."></li>
                <li data-pt="Marca a caixa do <b>Tune Shifter</b>."
                    data-en="Check the box next to <b>Tune Shifter</b>."></li>
                <li data-pt="Em <b>Editar sites</b>, permite o Tune Shifter nos sites que queres (ou em todos)."
                    data-en="Under <b>Edit Websites</b>, allow Tune Shifter on the sites you want (or all of them)."></li>
                <li data-pt="Abre um vídeo e clica no ícone do Tune Shifter na barra do Safari."
                    data-en="Open a video and click the Tune Shifter icon in the Safari toolbar."></li>
            </ol>
            <ol class="platform-ios">
                <li data-pt="Abre <b>Definições &gt; Apps &gt; Safari &gt; Extensões</b>."
                    data-en="Open <b>Settings &gt; Apps &gt; Safari &gt; Extensions</b>."></li>
                <li data-pt="Toca em <b>Tune Shifter</b> e liga <b>Permitir extensão</b>."
                    data-en="Tap <b>Tune Shifter</b> and turn on <b>Allow Extension</b>."></li>
                <li data-pt="Em <b>Permissões</b>, permite nos sites que queres (ou em todos)."
                    data-en="Under <b>Permissions</b>, allow it on the sites you want (or all of them)."></li>
                <li data-pt="No Safari, abre um vídeo, toca no botão do menu da página e escolhe <b>Tune Shifter</b>."
                    data-en="In Safari, open a video, tap the page menu button and choose <b>Tune Shifter</b>."></li>
            </ol>
        </section>

        <button class="platform-mac open-preferences" data-pt="Abrir as definições do Safari" data-en="Open Safari Settings"></button>

        <footer data-pt="Sem contas, sem anúncios e sem recolha de dados." data-en="No accounts, no ads and no data collection."></footer>
    </main>
</body>
</html>
